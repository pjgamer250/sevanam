<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>സേവനം — Govt. Services Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green-deep: #163828;
    --green-mid: #1F5E45;
    --gold: #C08A2E;
    --gold-soft: #E2B65B;
    --cream: #F6F2E7;
    --ink: #1B1A16;
    --ink-soft: #57544A;
    --line: #DCD4BD;
    --card-bg: #FFFFFF;
    --bg: var(--cream);
    --text: var(--ink);
    --text-soft: var(--ink-soft);
    --surface: var(--card-bg);
    --border: var(--line);
    --accent: var(--green-mid);
    --accent-2: var(--gold);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14211B;
      --text: #EDE8DA;
      --text-soft: #B2AA98;
      --surface: #1B2C24;
      --border: #2E4438;
      --accent: #6FBE9B;
      --accent-2: #E2B65B;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14211B;
    --text: #EDE8DA;
    --text-soft: #B2AA98;
    --surface: #1B2C24;
    --border: #2E4438;
    --accent: #6FBE9B;
    --accent-2: #E2B65B;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Noto Sans Malayalam', sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background .25s ease, color .25s ease;
  }
  [lang-active="ml"] .ml-text { font-family: 'Manjari', 'Noto Sans Malayalam', sans-serif; }

  header {
    position: sticky;
    top: 0;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    max-width: 980px;
    margin: 0 auto;
    padding: 22px 20px 16px;
  }
  .brand-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .brand .mark {
    width: 34px; height: 34px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--green-mid), var(--green-deep));
    display: flex; align-items: center; justify-content: center;
    color: var(--gold-soft);
    font-family: 'Manjari', sans-serif;
    font-weight: 700;
    font-size: 18px;
    flex-shrink: 0;
  }
  .brand h1 {
    font-size: 19px;
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .brand .sub {
    font-size: 12.5px;
    color: var(--text-soft);
    margin-top: 1px;
  }
  .controls { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .pill-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 100px;
    padding: 7px 13px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    font-family: inherit;
  }
  .pill-btn:hover { border-color: var(--accent); }
  .pill-btn:focus-visible, .search input:focus-visible, .chip:focus-visible, .card:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .search { max-width: 980px; margin: 0 auto; padding: 14px 20px 0; }
  .search input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 14.5px;
    font-family: inherit;
  }
  .search input::placeholder { color: var(--text-soft); }

  .chips {
    max-width: 980px;
    margin: 0 auto;
    padding: 12px 20px 18px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .chip {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-soft);
    padding: 6px 12px;
    border-radius: 100px;
    font-size: 12.5px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 500;
  }
  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
    font-weight: 600;
  }

  main { max-width: 980px; margin: 0 auto; padding: 8px 20px 60px; }
  .category-block { margin-top: 30px; }
  .category-block h2 {
    font-size: 13px;
    text-transform: none;
    letter-spacing: 0.01em;
    color: var(--accent-2);
    margin: 0 0 12px;
    font-weight: 700;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
  }
  .card {
    display: block;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 15px;
    transition: border-color .15s ease;
    cursor: pointer;
  }
  .card:hover, .card.open { border-color: var(--accent); }
  .card .name-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card .name { font-weight: 600; font-size: 14.5px; margin-bottom: 4px; }
  .card .desc { font-size: 12.5px; color: var(--text-soft); line-height: 1.4; }
  .card .caret { color: var(--text-soft); font-size: 11px; transition: transform .15s ease; flex-shrink: 0; }
  .card.open .caret { transform: rotate(180deg); }
  .sub-services {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .card.open .sub-services { display: block; }
  .sub-services ul {
    list-style: none;
    margin: 0 0 12px;
    padding: 0;
    display: grid;
    gap: 6px;
  }
  .sub-services li {
    font-size: 12.5px;
    color: var(--text);
    padding-left: 14px;
    position: relative;
    line-height: 1.4;
  }
  .sub-services li::before {
    content: "";
    position: absolute;
    left: 0; top: 6px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent-2);
  }
  .visit-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--bg);
    background: var(--accent);
    padding: 7px 12px;
    border-radius: 100px;
    text-decoration: none;
  }
  .visit-link:hover { opacity: 0.9; }

  .empty { text-align: center; padding: 60px 20px; color: var(--text-soft); }

  footer {
    max-width: 980px; margin: 0 auto; padding: 20px 20px 40px;
    font-size: 12px; color: var(--text-soft); border-top: 1px solid var(--border); margin-top: 20px;
  }
  @media (max-width: 480px) {
    .brand h1 { font-size: 17px; }
    .grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>

</header>

<main id="main"></main>

</footer>

];

let lang = localStorage.getItem('gd_lang') || 'en';
let theme = localStorage.getItem('gd_theme') || '';
let activeCat = 'all';
let query = '';

const body = document.body;
const chipRow = document.getElementById('chipRow');
const main = document.getElementById('main');
const searchInput = document.getElementById('searchInput');

function applyTheme() {
  if (theme) body.setAttribute('data-theme', theme);
  else body.removeAttribute('data-theme');
}
function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.setAttribute('lang-active', lang);
  document.getElementById('siteTitle').textContent = lang === 'ml' ? 'സേവനം — ഡയറക്ടറി' : 'സേവനം — Directory';
  document.getElementById('siteSub').textContent = lang === 'ml' ? 'എല്ലാ സർക്കാർ ഇ-സേവനങ്ങളും ഒരിടത്ത്' : 'All government e-services, one place';
  searchInput.placeholder = lang === 'ml' ? 'സേവനം തിരയുക — ആധാർ, കെഎസ്ഇബി, PSC…' : 'Search a service — Aadhaar, KSEB, PSC…';
  document.getElementById('footNote').textContent = lang === 'ml'
    ? 'സർക്കാർ സേവന ലിങ്കുകളുടെ അനൗദ്യോഗിക ഡയറക്ടറി. വ്യക്തിഗത വിവരങ്ങൾ നൽകുന്നതിന് മുൻപ് ഔദ്യോഗിക സൈറ്റ് പരിശോധിക്കുക.'
    : 'Unofficial directory of government service links. Always verify on the official site before submitting personal information.';
}

function renderChips() {
  chipRow.innerHTML = '';
  CATS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip' + (activeCat === c.id ? ' active' : '');
    b.textContent = lang === 'ml' ? c.ml : c.en;
    b.setAttribute('lang-active', lang);
    if (lang === 'ml') b.style.fontFamily = "'Manjari','Noto Sans Malayalam',sans-serif";
    b.onclick = () => { activeCat = c.id; render(); };
    chipRow.appendChild(b);
  });
}

function render() {
  renderChips();
  const q = query.trim().toLowerCase();
  let filtered = DATA.filter(item => {
    const matchesCat = activeCat === 'all' || item.cat === activeCat;
    const matchesQ = !q || item.name.toLowerCase().includes(q) || item.name_ml.includes(query.trim()) || (item.d && item.d.toLowerCase().includes(q));
    return matchesCat && matchesQ;
  });

  main.innerHTML = '';
  if (filtered.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = lang === 'ml' ? 'ഒന്നും കണ്ടെത്തിയില്ല. മറ്റൊരു വാക്ക് ശ്രമിക്കുക.' : 'No services found. Try a different search.';
    main.appendChild(empty);
    return;
  }

  const grouped = {};
  filtered.forEach(item => {
    if (!grouped[item.cat]) grouped[item.cat] = [];
    grouped[item.cat].push(item);
  });

  CATS.forEach(c => {
    if (c.id === 'all' || !grouped[c.id]) return;
    const block = document.createElement('div');
    block.className = 'category-block';
    const h2 = document.createElement('h2');
    h2.textContent = lang === 'ml' ? c.ml : c.en;
    block.appendChild(h2);
    const grid = document.createElement('div');
    grid.className = 'grid';
    grouped[c.id].forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      card.tabIndex = 0;
      card.setAttribute('role', 'button');
      card.setAttribute('aria-expanded', 'false');

      const nameRow = document.createElement('div');
      nameRow.className = 'name-row';
      const nameDiv = document.createElement('div');
      nameDiv.className = 'name';
      nameDiv.textContent = lang === 'ml' ? item.name_ml : item.name;
      if (lang === 'ml') nameDiv.style.fontFamily = "'Manjari','Noto Sans Malayalam',sans-serif";
      const caret = document.createElement('span');
      caret.className = 'caret';
      caret.textContent = '▾';
      nameRow.appendChild(nameDiv);
      nameRow.appendChild(caret);

      const descDiv = document.createElement('div');
      descDiv.className = 'desc';
      descDiv.textContent = lang === 'ml' ? item.d_ml : item.d;
      if (lang === 'ml') descDiv.style.fontFamily = "'Noto Sans Malayalam',sans-serif";

      const subWrap = document.createElement('div');
      subWrap.className = 'sub-services';
      const ul = document.createElement('ul');
      const list = lang === 'ml' ? item.services_ml : item.services;
      (list || []).forEach(s => {
        const li = document.createElement('li');
        li.textContent = s;
        if (lang === 'ml') li.style.fontFamily = "'Noto Sans Malayalam',sans-serif";
        ul.appendChild(li);
      });
      const visitLink = document.createElement('a');
      visitLink.className = 'visit-link';
      visitLink.href = item.url;
      visitLink.target = '_blank';
      visitLink.rel = 'noopener noreferrer';
      visitLink.textContent = (lang === 'ml' ? 'സൈറ്റ് സന്ദർശിക്കുക' : 'Visit official site') + ' ↗';
      if (lang === 'ml') visitLink.style.fontFamily = "'Manjari','Noto Sans Malayalam',sans-serif";
      visitLink.onclick = (e) => e.stopPropagation();
      subWrap.appendChild(ul);
      subWrap.appendChild(visitLink);

      card.appendChild(nameRow);
      card.appendChild(descDiv);
      card.appendChild(subWrap);

      const toggle = () => {
        const isOpen = card.classList.toggle('open');
        card.setAttribute('aria-expanded', String(isOpen));
      };
      card.onclick = toggle;
      card.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } };

      grid.appendChild(card);
    });
    block.appendChild(grid);
    main.appendChild(block);
  });
}

document.getElementById('langBtn').onclick = () => {
  lang = lang === 'en' ? 'ml' : 'en';
  try { localStorage.setItem('gd_lang', lang); } catch(e) {}
  applyLang();
  render();
};
document.getElementById('themeBtn').onclick = () => {
  const current = theme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  theme = current === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('gd_theme', theme); } catch(e) {}
  applyTheme();
};
searchInput.oninput = (e) => { query = e.target.value; render(); };

applyTheme();
applyLang();
render();
</script>
</body>
</html>
